
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RAG Chatbot</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="chat-container">

    <!-- Header -->

    <div class="header">

        <div class="header-icon">
            ✦
        </div>

        <div>
            <h2>RAG Chatbot</h2>

            <p>
                Ask questions or analyze your documents
            </p>
        </div>

    </div>


    <!-- Chat -->

    <div id="chat-box">

        <div class="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <h3>
                Welcome to RAG Chatbot
            </h3>

            <p>
                Ask a question or attach a document
                to get started.
            </p>

        </div>

    </div>


    <!-- Attachment preview -->

    <div
        id="attachment-preview"
        class="attachment-preview"
        style="display: none;"
    >

        <div class="file-icon">
            📄
        </div>

        <div class="file-details">

            <div id="file-name">
                document
            </div>

            <div id="file-type">
                File attached
            </div>

        </div>

        <button
            id="remove-file"
            class="remove-file"
            title="Remove file"
        >
            ×
        </button>

    </div>


    <!-- Input -->

    <div class="input-area">

        <label
            for="file-input"
            class="attach-button"
            title="Attach document"
        >
            📎
        </label>

        <input
            type="file"
            id="file-input"
            accept=".pdf,.docx,.txt"
            hidden
        >


        <input
            type="text"
            id="user-input"
            placeholder="Ask a question..."
            autocomplete="off"
        >


        <button
            id="send-button"
            class="send-button"
            title="Send"
        >

            <span>➤</span>

        </button>

    </div>


    <div class="supported-files">

        PDF · DOCX · TXT

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
